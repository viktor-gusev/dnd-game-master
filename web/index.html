<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DND Game Master</title>
    <link rel="stylesheet" href="/css/app.css">
  </head>
  <body>
    <main>
      <header class="hero panel">
        <p class="eyebrow">Session Directory</p>
        <h1>DND Game Master</h1>
        <p>Open a session workspace after choosing or creating a game session.</p>
        <p id="status">Preparing browser-local identity.</p>
      </header>

      <section class="panel two-column-layout">
        <form id="identityForm" class="card-form">
          <h2>Local Identity</h2>
          <label for="identityUuid">UUID</label>
          <input id="identityUuid" name="identityUuid" autocomplete="off" spellcheck="false" required>
          <label for="identityNickname">Nickname</label>
          <input id="identityNickname" name="identityNickname" autocomplete="nickname" required>
          <button type="submit">Save identity</button>
        </form>

        <form id="createSessionForm" class="card-form">
          <h2>Create Session</h2>
          <label for="sessionTitle">Session title</label>
          <input id="sessionTitle" name="sessionTitle" placeholder="Friday tavern run">
          <button type="submit">Create and open workspace</button>
        </form>
      </section>

      <section class="panel">
        <div class="section-header">
          <div>
            <p class="eyebrow">Available sessions</p>
            <h2>Session Directory</h2>
          </div>
          <button id="refreshSessions" type="button">Refresh list</button>
        </div>
        <div id="sessionDirectory" class="session-directory"></div>
      </section>
    </main>
    <script type="module" src="/js/directory.js"></script>
  </body>
</html>
