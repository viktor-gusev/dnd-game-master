<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DND Game Master</title>
    <link rel="stylesheet" href="/css/app.css">
  </head>
  <body class="directory-page">
    <main class="page-shell directory-shell">
      <header class="application-header" aria-label="Application Header">
        <div class="shell-row shell-row-primary">
          <strong class="shell-title">DnD Helper</strong>
          <div class="shell-status-cluster" aria-label="Shell status">
            <button id="shellConnectionState" type="button" class="shell-chip shell-chip-quiet shell-icon-button shell-icon-wifi shell-connection-state" aria-label="Connection not connected"></button>
            <button id="shellNotifications" type="button" class="shell-chip shell-icon-button shell-icon-bell" aria-label="Notifications"></button>
            <button id="shellLogs" type="button" class="shell-chip shell-chip-critical shell-icon-button shell-icon-alert" aria-label="Errors 0" aria-live="polite"></button>
          </div>
        </div>
        <div class="shell-row shell-row-secondary">
          <strong id="shellContextTitle" class="shell-title shell-title-secondary">Campaigns</strong>
          <div class="shell-row-secondary-right">
            <div id="shellPageActions" class="shell-page-actions" aria-label="Page actions"></div>
            <div class="shell-status-cluster shell-status-cluster-secondary" aria-label="Shell controls">
              <button id="shellDeviceStatus" type="button" class="shell-chip shell-chip-quiet shell-icon-button shell-icon-database" aria-label="Device ready"></button>
              <button id="shellProfile" type="button" class="shell-chip shell-icon-button shell-icon-user" aria-label="Alex Work"></button>
              <button id="shellMenu" type="button" class="shell-chip shell-icon-button shell-icon-menu" aria-label="Menu" aria-expanded="false" aria-controls="shellPanel"></button>
            </div>
          </div>
        </div>
      </header>

      <section id="pageRuntimeArea" class="page-runtime-area">
        <div class="page-runtime-content">
          <section class="directory-main">
            <div class="section-header directory-header">
              <div>
                <h1>Campaigns</h1>
                <p id="campaignDirectorySummary">Loading campaigns.</p>
              </div>
              <div class="section-actions">
                <button id="openCreateCampaign" type="button">Create campaign</button>
                <button id="refreshCampaigns" type="button">Refresh list</button>
              </div>
            </div>
            <p id="status" class="status-line">Preparing browser-local identity.</p>
            <div id="campaignDirectory" class="campaign-directory"></div>
          </section>
        </div>
      </section>

      <footer class="application-footer" aria-label="Application Footer">
        <button id="footerCampaigns" type="button">Campaigns</button>
        <button id="footerUpdates" type="button">Events</button>
        <button id="footerProfile" type="button">Profile</button>
      </footer>

      <section id="shellPanel" class="shell-panel" hidden></section>

      <dialog id="campaignDetailsDialog" class="shell-dialog">
        <div id="selectedCampaignDetail" class="campaign-detail"></div>
      </dialog>
      <dialog id="identityDialog" class="shell-dialog">
        <form id="identityForm" class="card-form surface-card">
          <p class="eyebrow">Local Identity</p>
          <h2>Identity</h2>
          <label for="identityUuid">UUID</label>
          <input id="identityUuid" name="identityUuid" autocomplete="off" spellcheck="false" required>
          <label for="identityNickname">Nickname</label>
          <input id="identityNickname" name="identityNickname" autocomplete="nickname" required>
          <button type="submit">Save identity</button>
        </form>
      </dialog>
      <dialog id="createCampaignDialog" class="shell-dialog">
        <form id="createCampaignForm" class="card-form surface-card">
          <p class="eyebrow">Create Campaign</p>
          <h2>New campaign</h2>
          <label for="campaignTitle">Campaign title</label>
          <input id="campaignTitle" name="campaignTitle" placeholder="Friday tavern run">
          <button type="submit">Create and open workspace</button>
        </form>
      </dialog>
    </main>
    <script type="module" src="/js/directory.js"></script>
  </body>
</html>
