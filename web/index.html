<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DND Game Master</title>
    <link rel="stylesheet" href="/css/app.css">
  </head>
  <body>
    <main>
      <header class="hero panel">
        <p class="eyebrow">Tabletop session control</p>
        <h1>DND Game Master</h1>
        <p>An AI co-Dungeon Master for tabletop RPG sessions.</p>
        <p id="status">Create a local identity to begin.</p>
      </header>
      <section class="panel form-grid">
        <form id="identityForm" class="card-form">
          <label for="displayName">Local identity</label>
          <input id="displayName" name="displayName" autocomplete="nickname" placeholder="Player name" required>
          <button type="submit">Create identity</button>
        </form>
        <form id="sessionForm" class="card-form">
          <button type="submit">Create session</button>
        </form>
        <form id="joinForm" class="card-form">
          <input id="sessionId" name="sessionId" placeholder="Session id" required>
          <button type="submit">Join session</button>
        </form>
        <form id="messageForm" class="card-form">
          <input id="messageText" name="messageText" placeholder="Send a chat message" required>
          <button type="submit">Send message</button>
        </form>
        <ul id="messages"></ul>
      </section>
    </main>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
